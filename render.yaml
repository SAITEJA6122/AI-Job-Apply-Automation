services:
  - type: web
    name: naukri-automation-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PORT
        value: 5000
      - key: ENABLE_HTTPS
        value: false
      - key: FLASK_DEBUG
        value: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: naukri_automation
